[package]
name = "harpoon"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "harpoon"
path = "src/main.rs"

[dependencies]
anyhow = "1"
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
